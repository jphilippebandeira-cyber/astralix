<!doctype html><meta charset=utf-8><style>
body{margin:0;width:1080px;height:1920px;overflow:hidden;background:#0a1030;font-family:Inter,sans-serif}
#cap{position:absolute;left:60px;right:60px;top:1420px;text-align:center;color:#fff;font-size:72px;font-weight:700;line-height:1.15;text-shadow:0 4px 18px rgba(0,0,0,.8)}
#cap span{background:rgba(0,0,0,.35);padding:6px 18px;border-radius:14px;-webkit-box-decoration-break:clone}
.lab{position:absolute;color:#fff;font:800 34px Inter;background:#25d366;padding:10px 20px;border-radius:14px;transform:translate(-50%,-100%);white-space:nowrap;box-shadow:0 8px 24px rgba(0,0,0,.5);opacity:0}
#cta{position:absolute;left:90px;right:90px;top:1150px;background:#ffd23f;border-radius:26px;padding:44px;text-align:center;font:900 64px/1.15 Inter;color:#111;opacity:0;box-shadow:0 20px 60px rgba(0,0,0,.6)}
#cta small{display:block;font:700 40px Inter;margin-top:18px;color:#333}
#badge{position:absolute;top:90px;left:0;right:0;text-align:center}#badge b{display:inline-block;background:#0b3d2a;color:#25d366;border:3px solid #25d366;border-radius:18px;padding:14px 30px;font:900 44px Inter;opacity:0}
</style>
<div id=badge><b id=bd>24H POR DIA · 0 FUNCIONÁRIOS</b></div><div id=cap></div><div id=labs></div><div id=cta>Comenta AGENTE<br>e eu te mostro a cidade<br>do seu negócio<small>astralixai.com · teste grátis</small></div>
<script src="node_modules/three/build/three.min.js"></script>
<script>
const W=1080,H=1920;const R=new THREE.WebGLRenderer({antialias:true});R.setSize(W,H);R.setPixelRatio(1);document.body.prepend(R.domElement);
R.shadowMap.enabled=true;
const S=new THREE.Scene();S.background=new THREE.Color(0x0a1030);S.fog=new THREE.Fog(0x0a1030,40,90);
const C=new THREE.PerspectiveCamera(42,W/H,0.1,200);
S.add(new THREE.HemisphereLight(0x8899ff,0x221133,0.7));
const sun=new THREE.DirectionalLight(0xffeedd,0.9);sun.position.set(10,25,12);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);S.add(sun);
// desk & platform
const desk=new THREE.Mesh(new THREE.BoxGeometry(80,1,50),new THREE.MeshLambertMaterial({color:0x1a1f3d}));desk.position.y=-1.2;S.add(desk);
const plat=new THREE.Mesh(new THREE.CylinderGeometry(14,14.5,0.8,64),new THREE.MeshLambertMaterial({color:0x2a2f55}));plat.position.y=-0.4;plat.receiveShadow=true;S.add(plat);
const ring=new THREE.Mesh(new THREE.TorusGeometry(14.3,0.12,8,96),new THREE.MeshBasicMaterial({color:0x25d366}));ring.rotation.x=Math.PI/2;S.add(ring);
let seed=7;const rnd=()=>{seed=(seed*16807)%2147483647;return seed/2147483647};
const bcol=[0x3b4a8f,0x55628f,0x6a5acd,0x2f3b70,0x8a8fb5,0xc0566a];
const blds=[];
for(let x=-11;x<=11;x+=2.6)for(let z=-11;z<=11;z+=2.6){if(Math.hypot(x,z)>12.5||Math.abs(x)<1.4||Math.abs(z)<1.4)continue;
 const h=1+rnd()*5;const m=new THREE.Mesh(new THREE.BoxGeometry(2,h,2),new THREE.MeshLambertMaterial({color:bcol[Math.floor(rnd()*6)]}));m.position.set(x,h/2,z);m.castShadow=true;S.add(m);blds.push(m);
 for(let k=0;k<Math.floor(h*2);k++){const w=new THREE.Mesh(new THREE.BoxGeometry(0.3,0.3,0.05),new THREE.MeshBasicMaterial({color:rnd()<.7?0xffd98a:0x334}));w.position.set(x-0.5+rnd(),0.5+rnd()*(h-0.8),z+1.03);S.add(w);}}
// roads
const road=new THREE.MeshLambertMaterial({color:0x14182e});
const r1=new THREE.Mesh(new THREE.BoxGeometry(28,0.05,2.4),road);r1.position.y=0.03;S.add(r1);const r2=r1.clone();r2.rotation.y=Math.PI/2;S.add(r2);
// key buildings
const keys=[{p:[4,0,4],c:0x25d366,n:'💬 Atendimento'},{p:[-4,0,4],c:0x2f7df6,n:'📅 Agenda'},{p:[-4,0,-4],c:0xe69500,n:'💰 Pix (com seu OK)'},{p:[4,0,-4],c:0xff6a1a,n:'📊 Resumo do dia'}];
keys.forEach(k=>{const m=new THREE.Mesh(new THREE.BoxGeometry(2.4,7,2.4),new THREE.MeshLambertMaterial({color:k.c,emissive:k.c,emissiveIntensity:.25}));m.position.set(k.p[0],3.5,k.p[2]);m.castShadow=true;S.add(m);k.m=m;
 const d=document.createElement('div');d.className='lab';d.textContent=k.n;document.getElementById('labs').appendChild(d);k.d=d});
// agents
const ag=[];const cols=[0xff6a1a,0x25d366,0x2f7df6,0xffd23f,0xe11d48,0xffffff];
for(let i=0;i<70;i++){const g=new THREE.Group();const b=new THREE.Mesh(new THREE.BoxGeometry(.35,.5,.25),new THREE.MeshLambertMaterial({color:cols[i%6]}));b.position.y=.45;g.add(b);
 const hd=new THREE.Mesh(new THREE.BoxGeometry(.3,.3,.3),new THREE.MeshLambertMaterial({color:0xf0c8a0}));hd.position.y=.86;g.add(hd);
 const lg=new THREE.Mesh(new THREE.BoxGeometry(.3,.2,.2),new THREE.MeshLambertMaterial({color:0x222}));lg.position.y=.1;g.add(lg);
 const axis=i%2;const lane=(rnd()-.5)*1.8;const off=rnd()*26;const sp=(0.8+rnd()*1.2)*(rnd()<.5?1:-1);g.castShadow=true;S.add(g);ag.push({g,axis,lane,off,sp,b})}
const caps=[[0,"Construí uma empresa inteira em cima da minha mesa."],[3.2,"Cada bonequinho é um agente de IA."],[6.6,"Esse aqui responde o WhatsApp dos clientes."],[9.8,"Esse organiza a agenda."],[12.6,"Esse prepara o Pix. Só sai com o seu OK."],[15.6,"E esse te manda o resumo do dia."],[18.6,"Trabalham 24h. Sem folga. Sem salário."],[22,"Uma empresa pequena… que parece gigante."]];
function cam(t){
 let r,y,a,lx=0,ly=1,lz=0;
 if(t<3.2){const u=t/3.2;r=38-10*u;y=26-6*u;a=.6+u*.3}
 else if(t<6.6){const u=(t-3.2)/3.4;C.position.set(0.3,2.6-0.8*u,17-7*u);C.lookAt(0,0.6,0);return}
 else if(t<18.6){const i=Math.min(3,Math.floor((t-6.6)/3));const k=keys[[0,1,2,3][i]];const u=((t-6.6)%3)/3;const ka=Math.atan2(k.p[0],k.p[2]);r=25-4*u;y=14-2*u;a=ka+.25-u*.15;lx=k.p[0];ly=3.5;lz=k.p[2]}
 else if(t<22){const u=(t-18.6)/3.4;r=28+8*u;y=18+8*u;a=2+u*1.2}
 else{const u=Math.min(1,(t-22)/6);r=34+4*u;y=26+3*u;a=3.2+u*.4}
 C.position.set(Math.sin(a)*r,y,Math.cos(a)*r);C.lookAt(lx,ly,lz)}
let lastCap=-1;
window.render=function(t){
 cam(t);
 ag.forEach(o=>{let p=((o.off+t*o.sp)%26+26)%26-13;if(o.axis){o.g.position.set(p,0,o.lane);o.g.rotation.y=o.sp>0?Math.PI/2:-Math.PI/2}else{o.g.position.set(o.lane,0,p);o.g.rotation.y=o.sp>0?0:Math.PI}o.b.position.y=.45+Math.abs(Math.sin(t*10+o.off))*.06});
 R.render(S,C);
 // labels
 keys.forEach((k,i)=>{const show=t>6.6+i*3&&t<18.6||t>18.6&&t<22;const v=new THREE.Vector3(k.p[0],7.6,k.p[2]).project(C);k.d.style.left=(v.x*.5+.5)*W+'px';k.d.style.top=(-v.y*.5+.5)*H+'px';k.d.style.opacity=show?1:0});
 let ci=0;caps.forEach((c,i)=>{if(t>=c[0])ci=i});
 if(t<23.5){if(ci!==lastCap){lastCap=ci;}const txt=caps[ci][1];const words=txt.split(' ');const el=(t-caps[ci][0]);const n=Math.min(words.length,Math.floor(el/0.16)+1);
  document.getElementById('cap').innerHTML='<span>'+words.slice(0,n).join(' ')+'</span>'}else document.getElementById('cap').innerHTML='';
 document.getElementById('bd').style.opacity=t>18.6&&t<23.5?1:0;
 document.getElementById('cta').style.opacity=Math.max(0,Math.min(1,(t-23.3)*3));
};
window.render(0);
</script>
